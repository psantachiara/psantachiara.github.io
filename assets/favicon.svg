<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: the ps: namespace mark.
       Drawn as paths rather than <text> so it renders identically everywhere —
       favicons are fetched without the page's font stack, so a <text> element
       would fall back to whatever the browser happens to have.
       Dark ground by default; the media query below inverts it for browsers
       reporting a light theme. -->

  <rect width="64" height="64" rx="10" fill="#070a12" class="bg"/>

  <!-- p — stem with a bowl, descending below the baseline -->
  <path d="M12 24 L12 52" stroke="#ece9e2" stroke-width="5.5" stroke-linecap="round" class="fg"/>
  <path d="M12 27 C12 23.5, 15 22, 18.5 22 C23.5 22, 27 26, 27 31.5 C27 37, 23.5 41, 18.5 41 C15 41, 12 39.5, 12 36"
        fill="none" stroke="#ece9e2" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" class="fg"/>

  <!-- s -->
  <path d="M45 25.5 C43 22.5, 39.5 22, 37 22 C33.5 22, 31.5 24, 31.5 26.5 C31.5 32, 44 29.5, 44 36 C44 39, 41 41, 37.5 41 C34.5 41, 31.5 40, 30 37.5"
        fill="none" stroke="#ece9e2" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" class="fg"/>

  <!-- the colon, in gold: the whole point of the mark -->
  <circle cx="53" cy="28" r="3.4" fill="#d8b26a" class="accent"/>
  <circle cx="53" cy="38.5" r="3.4" fill="#d8b26a" class="accent"/>

  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; }
      .fg { stroke: #16181d; }
      .accent { fill: #9a7526; }
    }
  </style>
</svg>
