/* ---------- Scroll reveal ---------- */
function Reveal({ children, delay = 0, className = "" }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(prefersReduced);
  useEffect(() => {
    if (prefersReduced) return;
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } });
    }, { threshold: 0.1, rootMargin: "0px 0px -6% 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return html`<div ref=${ref} class=${"reveal " + (shown ? "in " : "") + className} style=${{ transitionDelay: delay + "ms" }}>${children}</div>`;
}

/* ---------- Typed text ------------------------------------------------------
   Renders the whole string immediately as per-character spans, then reveals
   them on a stagger once the paragraph scrolls into view. The text is never
   absent from the DOM, so anything that reads the rendered page still sees it.
   A safety timer forces the finished state after four seconds in case the
   observer never fires — a headless renderer with no real viewport, say.
   ---------------------------------------------------------------------------- */
function Typed({ text, start = 0, speed = TYPING.speed, className = "", tag = "p" }) {
  const ref = useRef(null);
  const instant = prefersReduced || !TYPING.enabled;
  const [on, setOn] = useState(instant);
  const [forced, setForced] = useState(instant);

  useEffect(() => {
    if (instant) return;
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setOn(true); io.disconnect(); } });
    }, { threshold: 0.15, rootMargin: "0px 0px -5% 0px" });
    io.observe(el);
    const safety = setTimeout(() => setForced(true), 4000);
    return () => { io.disconnect(); clearTimeout(safety); };
  }, []);

  const words = text.split(" ");
  let i = 0;
  const nodes = [];
  words.forEach((word, wi) => {
    nodes.push(html`<span key=${"w" + wi} class="t-w">
      ${word.split("").map((c, ci) => {
        const d = start + (i++) * speed;
        return html`<span key=${ci} class="t-c" style=${{ "--d": d + "ms" }}>${c}</span>`;
      })}
    </span>`);
    if (wi < words.length - 1) {
      const d = start + (i++) * speed;
      nodes.push(html`<span key=${"s" + wi} class="t-c t-sp" style=${{ "--d": d + "ms" }}> </span>`);
    }
  });

  const cls = "typed " + (forced ? "instant " : on ? "on " : "") + className;
  // 1.5× the stagger: long enough not to flicker at 60fps, short enough that
  // only the current character (and just barely its neighbour) is lit
  return React.createElement(tag, { ref, className: cls, style: { "--s": (speed * 1.5) + "ms" } }, nodes);
}

// total animation time for a string, used to run paragraphs one after another
const typedDuration = (text, speed = TYPING.speed) => text.length * speed;

/* ---------- Graph field -------------------------------------------------
   A starfield read as an RDF graph. Three parallax depth layers of drifting
   nodes; the nearest layer is the only one that participates in the graph, so
   the line count stays low and the far sky still reads as sky.

   Node shapes follow the convention used in RDF diagrams:
     · filled circle  = IRI resource
     · small square   = literal   (gold, the accent colour)
     · hollow circle  = blank node

   Edges appear between near nodes that drift within range of each other, and
   fade as they separate. Every few seconds one edge is asserted as a triple:
   it gains a direction arrow, a predicate label along the arc, and a pulse
   travelling subject → object. Then it relaxes back into an untyped edge.

   Tuning knobs are gathered in CONFIG below.
   -------------------------------------------------------------------------- */
function GraphField() {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w = 0, h = 0, dpr = 1, stars = [], graphIdx = [], triples = [], raf = 0, t = 0;
    let mx = 0, my = 0, tx = 0, ty = 0, nextSpawn = 0;

    const CONFIG = {
      linkDist:    170,   // px within which two graph nodes connect
      edgeAlpha:   0.20,  // strongest an untyped edge ever gets
      maxTriples:  3,     // labelled triples visible at once
      tripleLife:  9000,  // ms a triple takes to appear, hold, and fade
      spawnEvery:  2600,  // ms between attempts to assert a new triple
      labelAlpha:  0.34,  // strongest a predicate label ever gets
    };

    // depth layers: density per 100k px², radius, drift speed, opacity, parallax
    const LAYERS = [
      { density: 26, r: 0.6, sp: 0.010, op: 0.42, par: 2, graph: false },
      { density: 14, r: 0.9, sp: 0.021, op: 0.60, par: 5, graph: false },
      { density: 4.4, r: 1.4, sp: 0.034, op: 0.92, par: 9, graph: true },
    ];

    const resize = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.max(1, w * dpr);
      canvas.height = Math.max(1, h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const init = () => {
      stars = []; graphIdx = []; triples = [];
      const area = (w * h) / 100000;
      LAYERS.forEach((L) => {
        const n = Math.round(L.density * area);
        for (let i = 0; i < n; i++) {
          const roll = Math.random();
          stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: L.r * (0.7 + Math.random() * 0.6),
            // slow drift, mostly rightward and slightly up, like a long exposure
            vx: L.sp * (0.6 + Math.random() * 0.8),
            vy: -L.sp * (0.15 + Math.random() * 0.3),
            op: L.op * (0.55 + Math.random() * 0.45),
            par: L.par,
            graph: L.graph,
            // node kind, only meaningful on the graph layer
            kind: !L.graph ? "iri" : roll < 0.18 ? "literal" : roll < 0.28 ? "blank" : "iri",
            // a small minority twinkle; the rest stay steady so it reads calm
            tw: Math.random() < 0.16 ? (0.4 + Math.random() * 0.6) : 0,
            ph: Math.random() * Math.PI * 2,
          });
          if (L.graph) graphIdx.push(stars.length - 1);
        }
      });
    };

    const pos = (s) => [s.x + tx * s.par, s.y + ty * s.par];

    // Try to assert a triple on a pair that is currently within linking range.
    const spawnTriple = () => {
      if (graphIdx.length < 2) return;
      for (let attempt = 0; attempt < 24; attempt++) {
        const ai = graphIdx[(Math.random() * graphIdx.length) | 0];
        const a = stars[ai];
        // a literal cannot be the subject of a triple, so skip those
        if (a.kind === "literal") continue;
        const near = [];
        for (const bi of graphIdx) {
          if (bi === ai) continue;
          const b = stars[bi];
          if (Math.hypot(a.x - b.x, a.y - b.y) < CONFIG.linkDist * 0.85) near.push(bi);
        }
        if (!near.length) continue;
        const bi = near[(Math.random() * near.length) | 0];
        if (triples.some(tr => (tr.a === ai && tr.b === bi) || (tr.a === bi && tr.b === ai))) continue;
        triples.push({
          a: ai, b: bi,
          pred: PREDICATES[(Math.random() * PREDICATES.length) | 0],
          born: t,
        });
        return;
      }
    };

    const drawNode = (s) => {
      const [px, py] = pos(s);
      let o = s.op;
      if (s.tw) o *= 0.55 + 0.45 * Math.sin(t * 0.0011 * (1 + s.tw) + s.ph);
      if (s.kind === "literal") {
        // literals are rectangles in RDF diagrams; gold ties them to the accent
        ctx.fillStyle = "rgba(216,178,106," + o + ")";
        ctx.fillRect(px - s.r, py - s.r * 0.85, s.r * 2, s.r * 1.7);
      } else if (s.kind === "blank") {
        ctx.strokeStyle = "rgba(232,238,248," + (o * 0.85) + ")";
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(px, py, s.r * 1.15, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.fillStyle = "rgba(232,238,248," + o + ")";
        ctx.beginPath(); ctx.arc(px, py, s.r, 0, Math.PI * 2); ctx.fill();
      }
    };

    const drawEdges = () => {
      ctx.lineWidth = 0.7;
      for (let i = 0; i < graphIdx.length; i++) {
        for (let j = i + 1; j < graphIdx.length; j++) {
          const a = stars[graphIdx[i]], b = stars[graphIdx[j]];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d >= CONFIG.linkDist) continue;
          const o = (1 - d / CONFIG.linkDist) * CONFIG.edgeAlpha;
          const [ax, ay] = pos(a), [bx, by] = pos(b);
          ctx.strokeStyle = "rgba(147,188,217," + o + ")";
          ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        }
      }
    };

    const drawTriples = () => {
      for (let i = triples.length - 1; i >= 0; i--) {
        const tr = triples[i];
        const life = (t - tr.born) / CONFIG.tripleLife;
        const a = stars[tr.a], b = stars[tr.b];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        // retire when its time is up or the nodes have drifted apart
        if (life >= 1 || d > CONFIG.linkDist) { triples.splice(i, 1); continue; }

        const fade = Math.sin(Math.PI * life);          // ease in, hold, ease out
        const [ax, ay] = pos(a), [bx, by] = pos(b);
        const ang = Math.atan2(by - ay, bx - ax);

        // the asserted edge, brighter than an untyped one
        ctx.strokeStyle = "rgba(147,188,217," + (fade * 0.5) + ")";
        ctx.lineWidth = 0.9;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();

        // arrowhead, set back from the object node
        const hx = bx - Math.cos(ang) * (b.r + 4);
        const hy = by - Math.sin(ang) * (b.r + 4);
        ctx.fillStyle = "rgba(147,188,217," + (fade * 0.6) + ")";
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx - Math.cos(ang - 0.42) * 6, hy - Math.sin(ang - 0.42) * 6);
        ctx.lineTo(hx - Math.cos(ang + 0.42) * 6, hy - Math.sin(ang + 0.42) * 6);
        ctx.closePath(); ctx.fill();

        // pulse travelling subject → object, one pass per triple
        const p = Math.min(1, life * 1.9);
        if (p < 1) {
          ctx.fillStyle = "rgba(240,220,174," + (fade * 0.9) + ")";
          ctx.beginPath();
          ctx.arc(ax + (bx - ax) * p, ay + (by - ay) * p, 1.6, 0, Math.PI * 2);
          ctx.fill();
        }

        // predicate label, set along the arc the way it would be in a diagram
        const flip = ang > Math.PI / 2 || ang < -Math.PI / 2;
        ctx.save();
        ctx.translate((ax + bx) / 2, (ay + by) / 2);
        ctx.rotate(flip ? ang + Math.PI : ang);
        ctx.font = "500 10px 'JetBrains Mono', ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillStyle = "rgba(147,188,217," + (fade * CONFIG.labelAlpha) + ")";
        ctx.fillText(tr.pred, 0, -4);
        ctx.restore();
      }
    };

    const draw = () => {
      ctx.clearRect(0, 0, w, h);
      drawEdges();
      drawTriples();
      for (const s of stars) drawNode(s);
    };

    const step = (now) => {
      t = now;
      for (const s of stars) {
        s.x += s.vx; s.y += s.vy;
        if (s.x > w + 2) { s.x = -2; s.y = Math.random() * h; }
        if (s.y < -2)    { s.y = h + 2; s.x = Math.random() * w; }
      }
      if (t > nextSpawn) {
        nextSpawn = t + CONFIG.spawnEvery;
        if (triples.length < CONFIG.maxTriples) spawnTriple();
      }
      // ease the parallax offset toward the pointer position
      tx += (mx - tx) * 0.045;
      ty += (my - ty) * 0.045;
      draw();
      raf = requestAnimationFrame(step);
    };

    const onPointer = (e) => {
      mx = (e.clientX / w - 0.5) * 2;
      my = (e.clientY / h - 0.5) * 2;
    };
    const onResize = () => { resize(); init(); if (prefersReduced) draw(); };

    resize(); init();
    if (prefersReduced) draw();  // one static frame: nodes and edges, no motion
    else {
      raf = requestAnimationFrame(step);
      window.addEventListener("pointermove", onPointer, { passive: true });
    }
    window.addEventListener("resize", onResize);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      window.removeEventListener("pointermove", onPointer);
    };
  }, []);
  return html`<canvas ref=${ref} class="starfield" aria-hidden="true"></canvas>`;
}

                  ${p.links && p.links.length ? html`
                    <div class="pub-links">
                      ${p.links.map((l, j) => html`
                        <a key=${j} href=${l.url} target="_blank" rel="noopener">${l.label}</a>`)}
                    </div>` : null}
                </div>
              </div>`)}
          </div>
        </${Reveal}>`)}
    </div>
  </div>`;
}

function CVPage() {
  return html`<div class="page">
    <div class="wrap">
      <${PageHead}
        label="Record"
        title="Curriculum <em>Vitae</em>"
        kicker="A summary of appointments, training, funding, and service. The full document, including complete lists of talks and reviewing, is available as a PDF." />

      <div style=${{ marginTop: "10px" }}>
        <a class="btn" href=${SITE.cvPdf} target="_blank" rel="noopener">Download full CV (PDF)</a>
      </div>

      ${CV.map((sec, i) => html`
        <${Reveal} key=${i}>
          <div class="cv-section">
            <span class="label">${sec.heading}</span>
            ${sec.rows.map((r, j) => html`
              <div class="cv-row" key=${j}>
                <div class="when">${r.when}</div>
                <div>
                  <h4>${r.title}</h4>
                  ${r.where ? html`<p class="where">${r.where}</p>` : null}
                  ${r.detail ? html`<p class="detail">${r.detail}</p>` : null}
                </div>
              </div>`)}
          </div>
        </${Reveal}>`)}
    </div>
  </div>`;
}

function PortfolioPage() {
  return html`<div class="page">
    <div class="wrap">
      <${PageHead}
        label="Built"
        title="DH <em>Portfolio</em>"
        kicker="Tools, corpora, and experiments made in the course of research. Most are open source; each entry says what state it is in." />

      <${Reveal}>
        <div class="proj-grid" style=${{ marginTop: "34px" }}>
          ${PROJECTS.map((p, i) => html`
            <a class=${"proj " + (p.featured ? "featured" : "")} key=${i}
               href=${p.url} target="_blank" rel="noopener">
              <div class="meta-line"><span class="yr">${p.year}</span><span>${p.role}</span></div>
              <h4>${p.title}</h4>
              <p>${p.blurb}</p>
              <div class="tags">${p.tags.map((t, j) => html`<span key=${j}>${t}</span>`)}</div>
              <span class="go">${p.urlLabel || "Open"} →</span>
            </a>`)}
        </div>
      </${Reveal}>
    </div>
  </div>`;
}

const PAGES = {
  "/":             HomePage,
  "/publications": PublicationsPage,
  "/cv":           CVPage,
  "/portfolio":    PortfolioPage,
};

/* ============================================================================
   SHELL + ROUTER
   ============================================================================ */
function Nav({ path }) {
  const [open, setOpen] = useState(false);
  useEffect(() => { setOpen(false); }, [path]);
  return html`<header class="nav">
    <div class="wrap">
      <a class="brand" href="#/">${SITE.brandShort}<span class="dot">.</span></a>
      <nav class=${"nav-links " + (open ? "open" : "")}>
        ${ROUTES.map(r => html`
          <a key=${r.path} class=${path === r.path ? "active" : ""} href=${"#" + r.path}>${r.label}</a>`)}
      </nav>
      <button class=${"menu-btn " + (open ? "open" : "")} aria-label="Toggle navigation"
              aria-expanded=${open} onClick=${() => setOpen(o => !o)}>
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>`;
}

function App() {
  const parse = () => {
    const h = window.location.hash.replace(/^#/, "");
    return PAGES[h] ? h : "/";
  };
  const [path, setPath] = useState(parse());

  useEffect(() => {
    const onHash = () => { setPath(parse()); window.scrollTo({ top: 0, behavior: "auto" }); };
    window.addEventListener("hashchange", onHash);
    if (!window.location.hash) window.location.hash = "#/";
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    const r = ROUTES.find(r => r.path === path);
    document.title = (r && r.path !== "/" ? r.title + " — " : "") +
      SITE.givenName + " " + SITE.familyName;
  }, [path]);

  const Page = PAGES[path] || HomePage;

  return html`
    <${GraphField} />
    <div class="shell">
      <${Nav} path=${path} />
      <main key=${path}>${html`<${Page} />`}</main>
      <footer class="foot">
        <div class="wrap">
          <span>${SITE.givenName} ${SITE.familyName}</span>
          <span>${SITE.footerNote}</span>
        </div>
      </footer>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
