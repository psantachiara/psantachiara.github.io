function Reveal({ children, delay = 0, className = "" }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(prefersReduced);
  useEffect(() => {
    if (prefersReduced) return;
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } });
    }, { threshold: 0.1, rootMargin: "0px 0px -6% 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return html`<div ref=${ref} class=${"reveal " + (shown ? "in " : "") + className} style=${{ transitionDelay: delay + "ms" }}>${children}</div>`;
}

function Typed({ text, start = 0, speed = TYPING.speed, className = "", tag = "p" }) {
  const ref = useRef(null);
  const instant = prefersReduced || !TYPING.enabled;
  const [on, setOn] = useState(instant);
  const [forced, setForced] = useState(instant);

  useEffect(() => {
    if (instant) return;
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setOn(true); io.disconnect(); } });
    }, { threshold: 0.15, rootMargin: "0px 0px -5% 0px" });
    io.observe(el);
    const safety = setTimeout(() => setForced(true), 4000);
    return () => { io.disconnect(); clearTimeout(safety); };
  }, []);

  const words = text.split(" ");
  let i = 0;
  const nodes = [];
  words.forEach((word, wi) => {
    nodes.push(html`<span key=${"w" + wi} class="t-w">
      ${word.split("").map((c, ci) => {
        const d = start + (i++) * speed;
        return html`<span key=${ci} class="t-c" style=${{ "--d": d + "ms" }}>${c}</span>`;
      })}
    </span>`);
    if (wi < words.length - 1) {
      i++;
      nodes.push(" ");
    }
  });

  const cls = "typed " + (forced ? "instant " : on ? "on " : "") + className;
  return React.createElement(tag, { ref, className: cls, style: { "--s": (speed * 1.5) + "ms" } }, nodes);
}

function GraphField() {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w = 0, h = 0, dpr = 1, stars = [], graphIdx = [], triples = [], raf = 0, t = 0;
    let mx = 0, my = 0, tx = 0, ty = 0, nextSpawn = 0;

    const CONFIG = {
      linkDist:    170,
      edgeAlpha:   0.20,
      maxTriples:  3,
      tripleLife:  9000,
      spawnEvery:  2600,
      labelAlpha:  0.34,
    };

    const LAYERS = [
      { density: 26, r: 0.6, sp: 0.010, op: 0.42, par: 2, graph: false },
      { density: 14, r: 0.9, sp: 0.021, op: 0.60, par: 5, graph: false },
      { density: 4.4, r: 1.4, sp: 0.034, op: 0.92, par: 9, graph: true },
    ];

    const resize = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.max(1, w * dpr);
      canvas.height = Math.max(1, h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const init = () => {
      stars = []; graphIdx = []; triples = [];
      const area = (w * h) / 100000;
      LAYERS.forEach((L) => {
        const n = Math.round(L.density * area);
        for (let i = 0; i < n; i++) {
          const roll = Math.random();
          stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: L.r * (0.7 + Math.random() * 0.6),
            vx: L.sp * (0.6 + Math.random() * 0.8),
            vy: -L.sp * (0.15 + Math.random() * 0.3),
            op: L.op * (0.55 + Math.random() * 0.45),
            par: L.par,
            graph: L.graph,
            kind: !L.graph ? "iri" : roll < 0.18 ? "literal" : roll < 0.28 ? "blank" : "iri",
            tw: Math.random() < 0.16 ? (0.4 + Math.random() * 0.6) : 0,
            ph: Math.random() * Math.PI * 2,
          });
          if (L.graph) graphIdx.push(stars.length - 1);
        }
      });
    };

    const pos = (s) => [s.x + tx * s.par, s.y + ty * s.par];

    const spawnTriple = () => {
      if (graphIdx.length < 2) return;
      for (let attempt = 0; attempt < 24; attempt++) {
        const ai = graphIdx[(Math.random() * graphIdx.length) | 0];
        const a = stars[ai];
        if (a.kind === "literal") continue;
        const near = [];
        for (const bi of graphIdx) {
          if (bi === ai) continue;
          const b = stars[bi];
          if (Math.hypot(a.x - b.x, a.y - b.y) < CONFIG.linkDist * 0.85) near.push(bi);
        }
        if (!near.length) continue;
        const bi = near[(Math.random() * near.length) | 0];
        if (triples.some(tr => (tr.a === ai && tr.b === bi) || (tr.a === bi && tr.b === ai))) continue;
        triples.push({
          a: ai, b: bi,
          pred: PREDICATES[(Math.random() * PREDICATES.length) | 0],
          born: t,
        });
        return;
      }
    };

    const drawNode = (s) => {
      const [px, py] = pos(s);
      let o = s.op;
      if (s.tw) o *= 0.55 + 0.45 * Math.sin(t * 0.0011 * (1 + s.tw) + s.ph);
      if (s.kind === "literal") {
        ctx.fillStyle = "rgba(216,178,106," + o + ")";
        ctx.fillRect(px - s.r, py - s.r * 0.85, s.r * 2, s.r * 1.7);
      } else if (s.kind === "blank") {
        ctx.strokeStyle = "rgba(232,238,248," + (o * 0.85) + ")";
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(px, py, s.r * 1.15, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.fillStyle = "rgba(232,238,248," + o + ")";
        ctx.beginPath(); ctx.arc(px, py, s.r, 0, Math.PI * 2); ctx.fill();
      }
    };

    const drawEdges = () => {
      ctx.lineWidth = 0.7;
      for (let i = 0; i < graphIdx.length; i++) {
        for (let j = i + 1; j < graphIdx.length; j++) {
          const a = stars[graphIdx[i]], b = stars[graphIdx[j]];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d >= CONFIG.linkDist) continue;
          const o = (1 - d / CONFIG.linkDist) * CONFIG.edgeAlpha;
          const [ax, ay] = pos(a), [bx, by] = pos(b);
          ctx.strokeStyle = "rgba(147,188,217," + o + ")";
          ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        }
      }
    };

    const drawTriples = () => {
      for (let i = triples.length - 1; i >= 0; i--) {
        const tr = triples[i];
        const life = (t - tr.born) / CONFIG.tripleLife;
        const a = stars[tr.a], b = stars[tr.b];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (life >= 1 || d > CONFIG.linkDist) { triples.splice(i, 1); continue; }

        const fade = Math.sin(Math.PI * life);
        const [ax, ay] = pos(a), [bx, by] = pos(b);
        const ang = Math.atan2(by - ay, bx - ax);

        ctx.strokeStyle = "rgba(147,188,217," + (fade * 0.5) + ")";
        ctx.lineWidth = 0.9;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();

        const hx = bx - Math.cos(ang) * (b.r + 4);
        const hy = by - Math.sin(ang) * (b.r + 4);
        ctx.fillStyle = "rgba(147,188,217," + (fade * 0.6) + ")";
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx - Math.cos(ang - 0.42) * 6, hy - Math.sin(ang - 0.42) * 6);
        ctx.lineTo(hx - Math.cos(ang + 0.42) * 6, hy - Math.sin(ang + 0.42) * 6);
        ctx.closePath(); ctx.fill();

        const p = Math.min(1, life * 1.9);
        if (p < 1) {
          ctx.fillStyle = "rgba(240,220,174," + (fade * 0.9) + ")";
          ctx.beginPath();
          ctx.arc(ax + (bx - ax) * p, ay + (by - ay) * p, 1.6, 0, Math.PI * 2);
          ctx.fill();
        }

        const flip = ang > Math.PI / 2 || ang < -Math.PI / 2;
        ctx.save();
        ctx.translate((ax + bx) / 2, (ay + by) / 2);
        ctx.rotate(flip ? ang + Math.PI : ang);
        ctx.font = "500 10px 'JetBrains Mono', ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillStyle = "rgba(147,188,217," + (fade * CONFIG.labelAlpha) + ")";
        ctx.fillText(tr.pred, 0, -4);
        ctx.restore();
      }
    };

    const draw = () => {
      ctx.clearRect(0, 0, w, h);
      drawEdges();
      drawTriples();
      for (const s of stars) drawNode(s);
    };

    const step = (now) => {
      t = now;
      for (const s of stars) {
        s.x += s.vx; s.y += s.vy;
        if (s.x > w + 2) { s.x = -2; s.y = Math.random() * h; }
        if (s.y < -2)    { s.y = h + 2; s.x = Math.random() * w; }
      }
      if (t > nextSpawn) {
        nextSpawn = t + CONFIG.spawnEvery;
        if (triples.length < CONFIG.maxTriples) spawnTriple();
      }
      tx += (mx - tx) * 0.045;
      ty += (my - ty) * 0.045;
      draw();
      raf = requestAnimationFrame(step);
    };

    const onPointer = (e) => {
      mx = (e.clientX / w - 0.5) * 2;
      my = (e.clientY / h - 0.5) * 2;
    };
    const onResize = () => { resize(); init(); if (prefersReduced) draw(); };

    resize(); init();
    if (prefersReduced) draw();
    else {
      raf = requestAnimationFrame(step);
      window.addEventListener("pointermove", onPointer, { passive: true });
    }
    window.addEventListener("resize", onResize);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      window.removeEventListener("pointermove", onPointer);
    };
  }, []);
  return html`<canvas ref=${ref} class="starfield" aria-hidden="true"></canvas>`;
}

function Authors({ list }) {
  const me = SITE.familyName + ", " + SITE.givenName.charAt(0) + ".";
  return html`<p class="authors">${list.map((a, i) => html`
    <span key=${i} class=${a === me ? "me" : ""}>${a}${i < list.length - 1 ? ", " : ""}</span>`)}</p>`;
}

function PageHead({ label, title, kicker }) {
  return html`<div class="page-head">
    <span class="label">${label}</span>
    <h2 dangerouslySetInnerHTML=${{ __html: title }}></h2>
    ${kicker ? html`<${Typed} text=${kicker} className="kicker" start=${300} />` : null}
  </div>`;
}

function HomePage() {
  return html`<div class="page">
    <section class="hero">
      <div class="wrap">
        <div class="rule"></div>
        <h1 class="name">
          <span class="given">${SITE.givenName}</span>
          <span class="family">${SITE.familyName}</span>
        </h1>
        <p class="role">${SITE.roles.map((r, i) => html`
          <span key=${i}>${i > 0 ? html`<span class="sep">/</span>` : null}${r}</span>`)}</p>
        <${Typed} text=${SITE.bio} className="bio" start=${450} />
        <div class="hero-links">
          <a class="btn" href="#/publications">Publications <span aria-hidden="true">→</span></a>
          <a class="btn-ghost" href="#/portfolio">DH Portfolio</a>
          <a class="btn-ghost" href=${"mailto:" + SITE.email}>Email</a>
        </div>
      </div>
    </section>

    <section class="band">
      <div class="wrap">
        <${Reveal}>
          <div class="split">
            <div>
              <span class="label">Details</span>
              <div class="side-note" style=${{ marginTop: "18px" }}>
                ${ABOUT.facts.map((f, i) => html`
                  <div class="fact" key=${i}>
                    <span class="pin">${f.k}</span>
                    ${Array.isArray(f.v)
                      ? html`<ul class="fact-list">${f.v.map((item, j) => html`<li key=${j}>${item}</li>`)}</ul>`
                      : html`<div>${f.v}</div>`}
                  </div>`)}
                <div class="fact">
                  <span class="pin">Links</span>
                  ${SITE.links.map((l, i) => html`
                    <div key=${"l" + i}><a href=${l.url} target="_blank" rel="noopener">${l.label}</a></div>`)}
                </div>
              </div>
            </div>
            <div>
              <span class="label">News</span>
              <div class="news">
                ${ABOUT.news.map((n, i) => html`
                  <div class="news-item" key=${i}>
                    <span class="pin">${n.k}</span>
                    <div class="t">${n.v}</div>
                    ${n.meta ? html`<div class="m">${n.meta}</div>` : null}
                  </div>`)}
              </div>
            </div>
          </div>
        </${Reveal}>
      </div>
    </section>

    <section class="band">
      <div class="wrap">
        <${Reveal}>
          <span class="label">Sections</span>
          <div class="index-grid" style=${{ marginTop: "24px" }}>
            ${INDEX_CARDS.map((c) => html`
              <a key=${c.path} href=${"#" + c.path}>
                <h4>${c.title}</h4>
                <p>${c.blurb}</p>
                <span class="arrow">Open →</span>
              </a>`)}
          </div>
        </${Reveal}>
      </div>
    </section>
  </div>`;
}

function GroupedList({ items, order, dated }) {
  const grouped = useMemo(() => {
    const present = Array.from(new Set(items.map(p => p.kind)));
    const ordered = order.filter(c => present.includes(c));
    const cats = ordered.concat(present.filter(c => !ordered.includes(c)));
    return cats.map(c => ({
      name: c,
      items: items.filter(p => p.kind === c).sort((a, b) => b.year - a.year),
    }));
  }, [items, order]);

  return grouped.map(g => html`
    <${Reveal} key=${g.name}>
      <div class="cat-group">
        <div class="cat-head">
          <h3>${g.name}</h3>
          <span class="count">${g.items.length}</span>
        </div>
        ${g.items.map((p, i) => html`
          <div class="pub" key=${i}>
            <div class="kind">
              ${p.year}${dated && p.date ? html`<span class="d">${p.date}</span>` : null}
            </div>
            <div>
              <h4>${p.title}</h4>
              <${Authors} list=${p.authors} />
              <p class="venue">${p.venue}</p>
              ${p.links && p.links.length ? html`
                <div class="pub-links">
                  ${p.links.map((l, j) => html`
                    <a key=${j} href=${l.url}
                       target=${l.url.startsWith("/") ? undefined : "_blank"}
                       rel=${l.url.startsWith("/") ? undefined : "noopener"}>${l.label}</a>`)}
                </div>` : null}
            </div>
          </div>`)}
      </div>
    </${Reveal}>`);
}

function PublicationsPage() {
  return html`<div class="page">
    <div class="wrap">
      <${PageHead}
        label="Writing"
        title="Publications"
        kicker="Grouped by kind, newest first within each. Open-access copies are linked where rights allow." />
      <${GroupedList} items=${PUBLICATIONS} order=${PUB_CATEGORIES} />
    </div>
  </div>`;
}

function TalksPage() {
  return html`<div class="page">
    <div class="wrap">
      <${PageHead}
        label="Speaking"
        title="Talks &amp; <em>Presentations</em>"
        kicker="Conference papers and invited lectures, newest first within each group. Slides and recordings are linked where they exist." />
      <${GroupedList} items=${TALKS} order=${TALK_CATEGORIES} dated=${true} />
    </div>
  </div>`;
}

function CVPage() {
  return html`<div class="page">
    <div class="wrap">
      <${PageHead}
        label="Record"
        title="Curriculum <em>Vitae</em>"
        kicker="A summary of education, research, teaching, funding, and service." />

      ${CV.map((sec, i) => html`
        <${Reveal} key=${i}>
          <div class="cv-section">
            <div class="cv-head">
              <h3 class="cv-heading">${sec.heading}</h3>
              <span class="count">${
                sec.rows
                  .filter(r => !r.subhead && !r.role)
                  .reduce((n, r) => n + (r.count || (sec.countTerms ? String(r.when).split(",").length : 1)), 0)
              }</span>
            </div>
            ${sec.rows.map((r, j) => {
              if (r.subhead) return html`<div class="cv-subhead" key=${j}>${r.subhead}</div>`;
              if (r.role)    return html`<div class="cv-role" key=${j}>${r.role}</div>`;
              return html`
                <div class="cv-row" key=${j}>
                  <div class="when">${r.when}</div>
                  <div>
                    <h4>${r.title}</h4>
                    ${r.where ? html`<p class="where">${r.where}</p>` : null}
                    ${r.detail ? html`<p class="detail">${r.detail}</p>` : null}
                  </div>
                </div>`;
            })}
          </div>
        </${Reveal}>`)}
    </div>
  </div>`;
}

function PortfolioPage() {
  return html`<div class="page">
    <div class="wrap">
      <${PageHead}
        label="Built"
        title="DH <em>Portfolio</em>"
        kicker="Projects built in the course of the Digital Humanities program at UCLA, in reverse chronological order. Each opens as it was presented." />

      <${Reveal}>
        <div class="proj-grid" style=${{ marginTop: "34px" }}>
          ${PROJECTS.map((p, i) => html`
            <a class="proj" key=${i} href=${p.url}>
              <div class="meta-line"><span class="yr">${p.year}</span></div>
              <h4>${p.title}</h4>
              ${p.people ? html`<div class="people"><${Authors} list=${p.people} /></div>` : null}
              <p>${p.blurb}</p>
              <div class="tags">${p.tags.map((t, j) => html`<span key=${j}>${t}</span>`)}</div>
            </a>`)}
        </div>
      </${Reveal}>
    </div>
  </div>`;
}

const PAGES = {
  "/":             HomePage,
  "/publications": PublicationsPage,
  "/talks":        TalksPage,
  "/cv":           CVPage,
  "/portfolio":    PortfolioPage,
};

function Nav({ path }) {
  const [open, setOpen] = useState(false);
  useEffect(() => { setOpen(false); }, [path]);
  return html`<header class="nav">
    <div class="wrap">
      <a class="brand" href="#/" aria-label=${SITE.givenName + " " + SITE.familyName + " — home"}>${SITE.brandShort}<span class="dot">:</span></a>
      <nav class=${"nav-links " + (open ? "open" : "")}>
        ${ROUTES.map(r => html`
          <a key=${r.path} class=${path === r.path ? "active" : ""} href=${"#" + r.path}
             aria-label=${r.title}>${r.label}</a>`)}
      </nav>
      <button class=${"menu-btn " + (open ? "open" : "")} aria-label="Toggle navigation"
              aria-expanded=${open} onClick=${() => setOpen(o => !o)}>
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>`;
}

function App() {
  const parse = () => {
    const h = window.location.hash.replace(/^#/, "");
    return PAGES[h] ? h : "/";
  };
  const [path, setPath] = useState(parse());

  useEffect(() => {
    const onHash = () => { setPath(parse()); window.scrollTo({ top: 0, behavior: "auto" }); };
    window.addEventListener("hashchange", onHash);
    if (!window.location.hash) window.location.hash = "#/";
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    const r = ROUTES.find(r => r.path === path);
    document.title = (r ? r.title + " — " : "") +
      SITE.givenName + " " + SITE.familyName;

    let tries = 0;
    const send = () => {
      if (window.goatcounter && window.goatcounter.count) {
        window.goatcounter.count({
          path:  path === "/" ? "/about" : path,
          title: r ? r.title : "",
          event: false,
        });
      } else if (tries++ < 20) {
        timer = setTimeout(send, 100);
      }
    };
    let timer = setTimeout(send, 0);
    return () => clearTimeout(timer);
  }, [path]);

  const Page = PAGES[path] || HomePage;

  return html`
    <${GraphField} />
    <div class="shell">
      <${Nav} path=${path} />
      <main key=${path}>${html`<${Page} />`}</main>
      <footer class="foot">
        <div class="wrap">
          <span>© ${new Date().getFullYear()} ${SITE.givenName} ${SITE.familyName}</span>
          <span>${SITE.footerNote}</span>
        </div>
      </footer>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
