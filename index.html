  body {

    .menu-btn {

  .reveal.in { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {

  footer.foot a:hover { color: var(--text-dim); }
</style>

/* ---------- Scroll reveal ---------- */
function Reveal({ children, delay = 0, className = "" }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(prefersReduced);
  useEffect(() => {
    if (prefersReduced) return;
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } });
    }, { threshold: 0.1, rootMargin: "0px 0px -6% 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return html`<div ref=${ref} class=${"reveal " + (shown ? "in " : "") + className} style=${{ transitionDelay: delay + "ms" }}>${children}</div>`;
}

/* ---------- Starfield: three parallax layers of drifting 1px stars ---------- */
function Starfield() {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w = 0, h = 0, dpr = 1, stars = [], raf = 0, t = 0;
    let mx = 0, my = 0, tx = 0, ty = 0;

    // depth layers: [count per 100k px², radius, speed, base opacity]
    const LAYERS = [
      { density: 26, r: 0.6, sp: 0.010, op: 0.42, par: 2 },
      { density: 14, r: 0.9, sp: 0.021, op: 0.62, par: 5 },
      { density: 5,  r: 1.3, sp: 0.036, op: 0.92, par: 9 },
    ];

    const resize = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.max(1, w * dpr);
      canvas.height = Math.max(1, h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const init = () => {
      stars = [];
      const area = (w * h) / 100000;
      LAYERS.forEach((L, li) => {
        const n = Math.round(L.density * area);
        for (let i = 0; i < n; i++) {
          stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: L.r * (0.7 + Math.random() * 0.6),
            // slow drift, mostly rightward and slightly up, like a long exposure
            vx: L.sp * (0.6 + Math.random() * 0.8),
            vy: -L.sp * (0.15 + Math.random() * 0.3),
            op: L.op * (0.55 + Math.random() * 0.45),
            par: L.par,
            // a small minority twinkle; the rest stay steady so it reads calm
            tw: Math.random() < 0.18 ? (0.4 + Math.random() * 0.6) : 0,
            ph: Math.random() * Math.PI * 2,
            warm: Math.random() < 0.14, // a few gold stars to tie into the palette
          });
        }
      });
    };

    const draw = () => {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        const px = s.x + tx * s.par;
        const py = s.y + ty * s.par;
        let o = s.op;
        if (s.tw) o *= 0.55 + 0.45 * Math.sin(t * 0.0011 * (1 + s.tw) + s.ph);
        ctx.fillStyle = s.warm
          ? "rgba(216,178,106," + o + ")"
          : "rgba(232,238,248," + o + ")";
        ctx.beginPath();
        ctx.arc(px, py, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    };

    const step = (now) => {
      t = now;
      for (const s of stars) {
        s.x += s.vx; s.y += s.vy;
        if (s.x > w + 2) { s.x = -2; s.y = Math.random() * h; }
        if (s.y < -2)    { s.y = h + 2; s.x = Math.random() * w; }
      }
      // ease the parallax offset toward the pointer position
      tx += (mx - tx) * 0.045;
      ty += (my - ty) * 0.045;
      draw();
      raf = requestAnimationFrame(step);
    };

    const onPointer = (e) => {
      mx = (e.clientX / w - 0.5) * 2;
      my = (e.clientY / h - 0.5) * 2;
    };
    const onResize = () => { resize(); init(); if (prefersReduced) draw(); };

    resize(); init();
    if (prefersReduced) draw();
    else {
      raf = requestAnimationFrame(step);
      window.addEventListener("pointermove", onPointer, { passive: true });
    }
    window.addEventListener("resize", onResize);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      window.removeEventListener("pointermove", onPointer);
    };
  }, []);
  return html`<canvas ref=${ref} class="starfield" aria-hidden="true"></canvas>`;
}

function Nav({ path }) {
  const [open, setOpen] = useState(false);
  useEffect(() => { setOpen(false); }, [path]);
  return html`<header class="nav">
    <div class="wrap">
      <a class="brand" href="#/">${SITE.brandShort}<span class="dot">.</span></a>
      <nav class=${"nav-links " + (open ? "open" : "")}>
        ${ROUTES.map(r => html`
          <a key=${r.path} class=${path === r.path ? "active" : ""} href=${"#" + r.path}>${r.label}</a>`)}
      </nav>
      <button class=${"menu-btn " + (open ? "open" : "")} aria-label="Toggle navigation"
              aria-expanded=${open} onClick=${() => setOpen(o => !o)}>
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>`;
}

function App() {
  const parse = () => {
    const h = window.location.hash.replace(/^#/, "");
    return PAGES[h] ? h : "/";
  };
  const [path, setPath] = useState(parse());

  useEffect(() => {
    const onHash = () => { setPath(parse()); window.scrollTo({ top: 0, behavior: "auto" }); };
    window.addEventListener("hashchange", onHash);
    if (!window.location.hash) window.location.hash = "#/";
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    const r = ROUTES.find(r => r.path === path);
    document.title = (r && r.path !== "/" ? r.title + " — " : "") +
      SITE.givenName + " " + SITE.familyName;
  }, [path]);

  const Page = PAGES[path] || HomePage;

  return html`
    <${Starfield} />
    <div class="shell">
      <${Nav} path=${path} />
      <main key=${path}>${html`<${Page} />`}</main>
      <footer class="foot">
        <div class="wrap">
          <span>${SITE.givenName} ${SITE.familyName} · ${SITE.footerNote}</span>
          <span>
            <a href=${"mailto:" + SITE.email}>${SITE.email}</a>
            ${SITE.links.map((l, i) => html`
              <span key=${i}> · <a href=${l.url} target="_blank" rel="noopener">${l.label}</a></span>`)}
          </span>
        </div>
      </footer>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
